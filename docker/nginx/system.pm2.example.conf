# managed-by: newapp v1.0.0  domain=vault.example.com  mode=proxy
# STANDALONE render, for a host WITHOUT newapp. The policy the snippets carry is inlined
# below, so this file depends on nothing under /etc/nginx/snippets. Two host files sit next
# to it and are installed ONCE per host, however many sites are rendered for it:
#   00-newapp-http.conf    -> /etc/nginx/conf.d/          (zones, header-floor maps, log format)
#   000-acme-catchall.conf -> /etc/nginx/sites-available/000-acme-catchall, enabled by symlink
# Target nginx: unspecified (the forms every supported release accepts).
# Assumed on the target: IPv6 sockets (delete the [::] lines otherwise), the certificate at
# /etc/letsencrypt/live/vault.example.com/, the ACME webroot /var/www/acme (certbot --webroot -w). The
# brotli tail install-host appends where the module is present is NOT here.
# Re-render rather than edit: a newer policy is a newer render of the same command.
# Rendered 2026-09-24T01:20:50Z.
# Policy lives in the included snippets, so improvements reach this site without newapp ever
# rewriting the file -- which is what makes hand-edits below safe to keep. Site-specific
# locations belong in a file passed with --include, never in this one.

server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;

    # --- acme-challenge.conf (inlined; an installed host includes /etc/nginx/snippets/acme-challenge.conf) ---
    # Host-global ACME HTTP-01 location. Included by EVERY vhost, on :80 and :443.
    #
    # The ^~ modifier is load-bearing: it makes this the longest matching prefix AND stops nginx
    # checking regular expressions, so a regex location cannot steal the challenge. It does NOT
    # protect against a server-level 'return'/'if', which runs in the rewrite phase BEFORE any
    # location is selected -- that is why the HTTPS redirect must live inside 'location /'.
    #
    # :443 matters too: a CDN "Always Use HTTPS" rule can upgrade the origin pull.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
        access_log /var/log/nginx/acme-challenge.log;
    }
    # --- end acme-challenge.conf ---

    # The redirect is NESTED inside location /. A server-level 'return 301' would run in the
    # rewrite phase BEFORE nginx selects a location, pre-empting even the ^~ ACME prefix above
    # and breaking every future renewal. That is the defect that caused the incident.
    #
    # $host, not a baked-in name. This block answers for every name the site has, and a
    # request for api.example.com must not be sent to example.com. Inside a server block with
    # explicit server_names $host is always one of those names, so this cannot become an
    # open redirect; www is canonicalised to the apex by its own :443 block below.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vault.example.com;

    ssl_certificate     /etc/letsencrypt/live/vault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;

    # --- app-tuning.conf (inlined; an installed host includes /etc/nginx/snippets/app-tuning.conf) ---
    # SERVER-context snippet. Include it INSIDE a server block, never at http context:
    # Ubuntu 26.04's stock nginx.conf already sets server_tokens/keepalive_timeout/
    # tcp_nodelay at http level, and a second copy there is a fatal "directive is
    # duplicate" (nginx -t fails, nginx never starts). Server context overrides the
    # http-level value with no duplicate error.
    server_tokens off;
    tcp_nodelay on;

    # Keep-alive: 65s is long enough for a browser's next click and for a CDN edge to reuse the
    # connection. keepalive_requests 1000 is nginx's default since 1.19.10 and, with the default
    # http2_max_concurrent_streams 128, the HTTP/2 Rapid Reset posture F5 recommends; it is
    # spelled out because 1.18 (Debian 11, Ubuntu 22.04) still defaults to 100.
    keepalive_timeout 65s;
    keepalive_requests 1000;

    # client_max_body_size is deliberately NOT here. newapp renders it into every :443 server
    # block itself (10M unless the site says `--body-size`), because a second copy of the same
    # directive in the same server context is a fatal "directive is duplicate" -- which is exactly
    # what a snippet-level default plus a per-site override produced, and what made --body-size
    # a knob that failed nginx -t. A directive that varies per site belongs in the site file.

    # Slow-client (slowloris) budget. These are INACTIVITY timeouts, not totals: client_body_timeout
    # is the gap between two body reads, send_timeout the gap between two writes, so a slow but
    # steady upload or download is never cut. 15s leaves margin for a TLS-then-headers round trip
    # on a poor mobile link; 10s (the previous value) sat at the edge of it.
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    reset_timedout_connection on;

    # 128k keeps an ordinary JSON body in memory instead of spilling to a temp file; 16k header
    # buffers accommodate JWT cookies and long Authorization headers, whose overflow is otherwise
    # an opaque 400 (header) or 414 (request line).
    client_body_buffer_size 128K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Proxy timeouts, at SERVER context on purpose: a location that needs longer (newapp
    # --read-timeout, a /socket.io/ or proxy-stream.conf location) overrides them without the fatal
    # "directive is duplicate" that two copies in the same location would be. connect 10s: an app that
    # does not accept within that is down; 120s read/send: a slow model response has that long between
    # two bytes before the client sees a 504.
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    # --- end app-tuning.conf ---
    # --- ssl-params.conf (inlined; an installed host includes /etc/nginx/snippets/ssl-params.conf) ---
    # TLS policy for every :443 server block. SERVER context: include it inside the server.
    #
    # Profile: the "intermediate" configuration of the TLS guidelines, version 6.0 (2026-06-11),
    # which the Mozilla SSL Configuration Generator became when it was archived on 2026-05-28
    # (now configurator.tlsref.org / docs.tlsref.org). Same six suites as before; the three DHE
    # suites are gone from the profile, so there is no ssl_dhparam here and none is needed:
    # nginx offers no DHE suite unless ssl_dhparam is set, and RFC 10015 (2026) deprecates
    # finite-field DHE in TLS 1.2 anyway.
    #
    # TLS 1.2 stays. RFC 9325 (BCP 195) still says implementations MUST support it, RFC 9851
    # (2026) only froze it, and the guideline keeps it in the intermediate profile for older API
    # clients. Spelled out rather than inherited: the nginx default gained TLSv1.3 only in 1.23.4,
    # so on 1.18 (Debian 11, Ubuntu 22.04) and 1.22 (Debian 12) an unset ssl_protocols is TLS 1.2
    # alone.
    ssl_protocols TLSv1.2 TLSv1.3;

    # TLS 1.2 suites only -- ECDHE, AEAD, forward-secret. TLS 1.3 suites are a separate OpenSSL
    # list whose built-in default is exactly the three the guideline names, so nothing is set for
    # them (that would need ssl_conf_command, nginx 1.19.4+, and would buy nothing).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # off: with only AEAD suites left, the client's order lets a device without AES hardware pick
    # ChaCha20. This is also the nginx default and the guideline's server_preferred_order=false.
    ssl_prefer_server_ciphers off;

    # KEY EXCHANGE GROUPS ARE DELIBERATELY NOT LISTED (nginx default: auto = OpenSSL's built-in
    # list). On OpenSSL 3.5 (Debian 13, Ubuntu 26.04) that list already puts the post-quantum
    # hybrid X25519MLKEM768 first, so every current browser negotiates it with no configuration.
    # Naming the group explicitly, as the guideline's tls_curves does, FAILS nginx -t on OpenSSL
    # 3.0 and 1.1.1 (Debian 11/12, Ubuntu 22.04/24.04) with "SSL_CTX_set1_curves_list() failed";
    # and the 2024-era explicit list without it (X25519:prime256v1:secp384r1) would silently switch
    # post-quantum OFF on the hosts that have it. `auto` is the one value that is right on all six.

    # Session resumption: one shared cache for every server on the host (the name and size must be
    # identical wherever it is stated, which the include guarantees). Since nginx 1.23.2 the shared
    # cache also generates and rotates the TLS ticket keys, so tickets stay on there; on 1.18 and
    # 1.22 the key is a fixed random value for the life of the master process, so install-host
    # appends `ssl_session_tickets off;` on those hosts (ssl-params-oldtickets.conf.part).
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # 0-RTT stays off (also the default): early data is replayable, the applications behind this
    # proxy do not implement RFC 8470's 425 Too Early, and no distro build in scope can do QUIC
    # 0-RTT anyway (that needs nginx 1.29.1 + OpenSSL 3.5.1).
    ssl_early_data off;

    # OCSP stapling is intentionally NOT enabled: Let's Encrypt removed OCSP URLs from
    # certificates (2025-05-07) and shut down its responders (2025-08-06), so 'ssl_stapling on' is
    # a no-op that logs '"ssl_stapling" ignored, no OCSP responder URL' on every reload.
    # Revocation now travels by CRL, which browsers fetch themselves; nginx has nothing to staple.

    # Strict-Transport-Security is NOT here any more. It lives in security-headers.conf, so that a
    # location which restates the header set (a location with a Cache-Control of its own loses
    # every inherited add_header) keeps HSTS too. Its value is $newapp_hsts, a per-server default
    # from conf.d that `newapp --hsts` can lower or raise.
    # --- end ssl-params.conf ---
    # --- security-headers.conf (inlined; an installed host includes /etc/nginx/snippets/security-headers.conf) ---
    # The response-header floor for every :443 server block, and for every LOCATION that declares
    # an add_header of its own.
    #
    # THE INHERITANCE RULE THIS FILE EXISTS FOR: nginx inherits add_header directives into a
    # location only when that location declares none. A location that sets so much as a
    # Cache-Control therefore silently drops every server-level header -- HSTS included -- from
    # exactly the responses it serves. So this file is included at server level AND re-included
    # inside any location that adds a header (newapp does that for a static site's /assets/ and
    # index.html; an --include file must do it for its own locations). `add_header_inherit merge`
    # would make that unnecessary, but it arrived in nginx 1.29.3 and no supported host has it.
    #
    # EVERY value below is a variable defined in conf.d/00-newapp-http.conf. Each is the policy
    # when the proxied application sent no such header, and the empty string -- which add_header
    # does not emit -- when it did. The application therefore always wins when it has an opinion,
    # and there is never a duplicate. HSTS is the exception in the other direction: the TLS
    # terminator owns it outright (proxy-common.conf hides the application's copy), and its
    # variable is a per-server default a site may lower with `newapp --hsts`.
    add_header Strict-Transport-Security      $newapp_hsts                          always;
    add_header Content-Security-Policy        $newapp_csp                           always;
    add_header X-Frame-Options                $newapp_x_frame_options               always;
    add_header X-Content-Type-Options         $newapp_x_content_type_options        always;
    add_header Referrer-Policy                $newapp_referrer_policy               always;
    add_header Permissions-Policy             $newapp_permissions_policy            always;
    add_header Cross-Origin-Opener-Policy     $newapp_cross_origin_opener_policy    always;
    add_header Cross-Origin-Resource-Policy   $newapp_cross_origin_resource_policy  always;
    add_header X-Permitted-Cross-Domain-Policies $newapp_x_permitted_cross_domain_policies always;
    add_header X-DNS-Prefetch-Control          $newapp_x_dns_prefetch_control        always;

    # The correlation id proxy-common.conf minted for this request, echoed so a support ticket
    # can quote it, and Retry-After on a 429 (empty, hence absent, on every other status).
    add_header X-Request-ID                   $request_id                           always;
    add_header Retry-After                    $newapp_retry_after                   always;

    # Deliberately ABSENT:
    #   X-XSS-Protection   the browser XSS auditor it controlled is gone from every current
    #                      engine; the header is deprecated and CSP is the control. An application
    #                      that still sends "0" is passed through untouched.
    #   Vary               gzip_vary in compression.conf emits Vary: Accept-Encoding on compressed
    #                      responses; a blanket "Vary: Origin" on every response fragments caches
    #                      for nothing, and an application that serves CORS sets its own.
    # --- end security-headers.conf ---
    # --- compression.conf (inlined; an installed host includes /etc/nginx/snippets/compression.conf) ---
    gzip on;
    # Vary: Accept-Encoding on every response gzip COULD compress, whether or not it did, so a
    # cache never hands a compressed body to a client that did not ask for one. This used to be
    # off because security-headers.conf emitted a Vary of its own (two Vary headers fragment
    # caches); that header is gone, and this directive is now the one place Vary comes from.
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_comp_level 5;
    gzip_types text/plain text/csv text/css application/json application/javascript text/xml application/xml application/xml+rss application/rss+xml text/javascript application/ld+json image/svg+xml font/truetype font/opentype application/vnd.ms-fontobject application/atom+xml application/geo+json application/x-javascript application/manifest+json application/rdf+xml application/xhtml+xml font/eot font/otf font/ttf;

    # Serve a pre-compressed .gz beside the file when the build produced one (static sites).
    gzip_static on;
    # --- end compression.conf ---
    # --- waf-nginx.conf (inlined; an installed host includes /etc/nginx/snippets/waf-nginx.conf) ---
    # A MINIMAL, ANCHORED deny set. What is NOT here, and why:
    #
    # nginx's `if` runs in the rewrite phase, before any location is matched, on the RAW wire form
    # of the request: $request_uri and $query_string are never percent-decoded, and the request body
    # does not exist yet. So a regex written for `' OR 1=1` never sees `%27%20OR%201%3D1`, a JSON body
    # (where every Express/FastAPI payload travels) is invisible to every rule, and each pattern is
    # attacker-controlled input fed through the rewrite/regex machinery that produced three of 2026's
    # nginx CVEs (CVE-2026-42945, CVE-2026-9256, CVE-2026-42533). The old SQLi/XSS/NoSQLi/command/XXE/
    # header-injection signatures therefore stopped only unencoded scanner noise, while matching
    # legitimate values (`?q=Location:+Madrid`, `?path=/usr/bin/python3`, `?q=char(65)`, `onmouse` as a
    # substring of a word). They are gone; input validation and output encoding live in the
    # application, and a real WAF engine (ModSecurity + CRS 4, opt-in) normalises before it matches.
    #
    # What stays is what nginx can decide correctly from the wire form alone. Two gates bound it:
    # tools/waf-acme-gate.sh proves no rule can intercept an ACME challenge, and
    # tools/waf-false-positive-gate.sh evaluates every rule against a corpus of real requests.
    #
    # ===========================================
    # 1. HTTP METHOD RESTRICTIONS
    # ===========================================
    # The "safe if" form (only `return` inside). limit_except is location-only and cannot express a
    # server-wide policy.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) { return 405; }
    if ($request_method ~ ^(TRACE|TRACK)$) { return 405; }

    # ===========================================
    # 2. SENSITIVE FILES AND PATHS
    # ===========================================
    # EVERY rule here is anchored to a whole PATH SEGMENT: `(?:^|/)` before the name and `(?:[/?]|$)`
    # (or the name's own suffixes) after it. The unanchored substrings of an earlier version bit real
    # routes -- `\.env` matched /static/config.env.js, `/shopify` 404'd threadcycle's
    # /api/v1/products/42/shopify/reconcile at the edge -- and the false-positive gate holds those
    # requests now.
    if ($request_uri ~* "(?:^|/)\.(?:git|svn|hg|bzr)(?:[/?]|$|attributes|ignore|modules|config)") { return 404; }
    if ($request_uri ~* "(?:^|/)(?:CVS|\.DS_Store|Thumbs\.db)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "(?:^|/)\.(?:env|htaccess|htpasswd|user\.ini|npmrc|dockerignore)(?:\.[a-z0-9_-]+)?(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "(?:^|/)(?:Dockerfile(?:\.[a-z0-9_-]+)?|(?:docker-)?compose(?:\.[a-z0-9_-]+)?\.ya?ml)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "(?:^|/)(?:composer\.(?:json|lock|phar)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Gemfile(?:\.lock)?|requirements\.txt|Pipfile(?:\.lock)?|pom\.xml|build\.gradle)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "(?:^|/)\.(?:idea|vscode|sublime-[a-z]+|project|settings)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "(?:^|/)nbproject(?:[/?]|$)") { return 404; }
    # Backup and dump EXTENSIONS (.bak, .old, .sql, .log ...) are deliberately NOT matched here: on a
    # proxied site nginx serves no files, so the rule protected nothing and 404'd every API route that
    # happened to end in one. A --static site refuses them in its own server block, as locations.

    # Scanner probes for software this host does not run, anchored at the path ROOT: a scanner asks
    # for /wp-login.php and /phpmyadmin, never /api/v1/manager/teams.
    if ($request_uri ~* "^/(?:wp-admin|wp-login\.php|wp-content/debug|wp-includes|xmlrpc\.php)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "^/(?:wp-json/wp/v2/users|wp-includes/wlwmanifest\.xml|wp-content/uploads/.*\.php)") { return 404; }
    if ($request_uri ~* "^/(?:phpmyadmin|pma|myadmin|mysql|mysqladmin|adminer|dbadmin)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "^/(?:administrator|admin\.php|manager|cpanel|webmail|cgi-bin)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "^/(?:joomla|drupal|magento|shopify|typo3|concrete5)(?:[/?]|$)") { return 404; }
    if ($request_uri ~* "^/(?:server-status|server-info|info\.php|phpinfo(?:\.php)?)(?:[/?]|$)") { return 404; }

    # System paths stay as SUBSTRINGS on purpose: a traversal payload puts them mid-URI
    # (/img/../../etc/passwd) and nothing legitimate carries "/etc/passwd" anywhere in a request.
    if ($request_uri ~* "(?:/etc/passwd|/etc/shadow|/etc/hosts|/proc/self|/var/log/)") { return 404; }

    # ===========================================
    # 3. PATH TRAVERSAL AND ENCODING TRICKS
    # ===========================================
    # Path handling is nginx's own business: it resolves the path, so it may refuse the forms that
    # only exist to confuse a path resolver. Plain, single-encoded and double-encoded dot-dot, null
    # bytes, %u and overlong-UTF-8 encodings. A bare %25 is legitimate (?label=50%25off) and passes.
    if ($request_uri ~* "(?:\.\./|\.\.\\\\|%2e%2e%2f|%2e%2e/|\.%2e/|%2e\./|\.\.%5c|%252e%252e)") { return 403; }
    if ($request_uri ~* "(?:%00|\x00|\0)") { return 403; }
    if ($request_uri ~* "(?:%252e%252e|%252f|%255c)") { return 403; }
    if ($request_uri ~* "(?:%u[0-9a-fA-F]{4}|%c[01][0-9a-fA-F]%[0-9a-fA-F]{2})") { return 403; }
    if ($request_uri ~* "(?:%c0%af|%c1%9c|%c0%9v)") { return 403; }

    # ===========================================
    # 4. SCANNER USER AGENTS (cosmetic)
    # ===========================================
    # A scanner that wants in sets a browser UA; this only quiets the ones that announce themselves,
    # and it is documented as cosmetic. Named tools only, never generic words (harvest|fetch|spider
    # matched real clients).
    if ($http_user_agent ~* "(?:nikto|sqlmap|nmap|masscan|zgrab|nuclei|wpscan|nessus|openvas|qualys|acunetix|burpsuite|w3af|arachni|skipfish|wapiti)") { return 403; }
    if ($http_user_agent ~* "(?:netsparker|appscan|webinspect|ratproxy|paros|dirbuster|gobuster|ffuf|feroxbuster|wfuzz|havij|sqlninja)") { return 403; }

    # ===========================================
    # 5. PROTOCOL
    # ===========================================
    if ($host = "") { return 400; }
    # --- end waf-nginx.conf ---
    # --- acme-challenge.conf (inlined; an installed host includes /etc/nginx/snippets/acme-challenge.conf) ---
    # Host-global ACME HTTP-01 location. Included by EVERY vhost, on :80 and :443.
    #
    # The ^~ modifier is load-bearing: it makes this the longest matching prefix AND stops nginx
    # checking regular expressions, so a regex location cannot steal the challenge. It does NOT
    # protect against a server-level 'return'/'if', which runs in the rewrite phase BEFORE any
    # location is selected -- that is why the HTTPS redirect must live inside 'location /'.
    #
    # :443 matters too: a CDN "Always Use HTTPS" rule can upgrade the origin pull.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
        access_log /var/log/nginx/acme-challenge.log;
    }
    # --- end acme-challenge.conf ---
    client_max_body_size 32M;

    # Site-specific locations, kept OUT of this file so a re-render never loses them.
    # A location in there that adds its own header must include
    # /etc/nginx/snippets/security-headers.conf itself: nginx drops every inherited
    # add_header the moment a location declares one of its own.
    include /etc/nginx/sites-local/hvault-pm2.conf;

    location / {
        proxy_pass http://127.0.0.1:5000;
        # --- proxy-common.conf (inlined; an installed host includes /etc/nginx/snippets/proxy-common.conf) ---
        # Forwarded-header set for a reverse-proxied site. Include INSIDE the location that proxies.
        #
        # Two facts decide everything in this file (nginx.org, ngx_http_proxy_module):
        #   1. nginx forwards EVERY client request header it does not redefine. Only Host and
        #      Connection are rewritten by default, so a client-supplied X-Forwarded-Host,
        #      Forwarded, True-Client-IP or X-Original-URL reaches the application untouched --
        #      and Express derives req.hostname from X-Forwarded-Host once `trust proxy` is on.
        #   2. A header set to an empty string is NOT passed. That is how a forgeable header is
        #      removed: set it to "".
        # So this hop, the outermost trusted proxy, SETS every trust-carrying header from what it
        # observed itself and BLANKS every one a client could have invented.
        #
        # On distribution nginx (1.18 to 1.28) the proxy defaults are still HTTP/1.0 and
        # `Connection: close`; mainline 1.29.7+ changed them. Written explicitly so the behaviour
        # does not depend on which nginx runs it.
        proxy_http_version 1.1;

        # WebSocket upgrade. $connection_upgrade is the map in conf.d/00-newapp-http.conf: "upgrade"
        # for a handshake, EMPTY for an ordinary request -- empty rather than "close", so an upstream
        # keepalive pool, where one exists, is not torn down on every request.
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;

        # X-Forwarded-For is SET, not appended. $proxy_add_x_forwarded_for appends the peer to
        # whatever the client sent, so the LEFTMOST entry becomes attacker-controlled -- and an
        # application that rate-limits on the leftmost entry is then trivially bypassed. nginx is
        # the trust boundary on this host; behind a CDN the realip module has already rewritten
        # $remote_addr from the CDN's own header using the trusted CDN ranges (and Cloudflare itself
        # APPENDS to a client-sent X-Forwarded-For, so extending its value would carry the forgery).
        # $remote_addr is therefore the real client in BOTH topologies and the chain starts here.
        #
        # The in-container nginx behind this port then APPENDS its peer, so an Express app behind
        # both sees "<client>, <docker gateway>" and `trust proxy` = 2 resolves the client. A FastAPI
        # app must list the compose network's subnet in FORWARDED_ALLOW_IPS for the same reason.
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        # One correlation id per request, minted here so it can be trusted, logged by nginx (see the
        # log_format in conf.d) and echoed to the client by security-headers.conf. Never the client's
        # own value: a client-chosen id is a log-injection vector for every consumer downstream.
        proxy_set_header X-Request-ID       $request_id;

        # Blanked: nothing legitimate reaches an application through these, and each is a way for a
        # client to be someone else. `Proxy` is httpoxy; `Forwarded` (RFC 7239) is not emitted by this
        # host and would otherwise arrive as the client wrote it; True-Client-IP / X-Client-IP /
        # CF-Connecting-IP are the IP headers other proxies use (the real client is already in
        # X-Forwarded-For and X-Real-IP above -- behind Cloudflare the realip module consumed
        # CF-Connecting-IP before it got here); X-Original-URL / X-Rewrite-URL are the IIS/ASP.NET
        # path-override headers that some frameworks still honour.
        proxy_set_header Proxy              "";
        proxy_set_header Forwarded          "";
        proxy_set_header True-Client-IP     "";
        proxy_set_header X-Client-IP        "";
        proxy_set_header CF-Connecting-IP   "";
        proxy_set_header X-Original-URL     "";
        proxy_set_header X-Rewrite-URL      "";

        # Response side. HSTS is OWNED by this layer (security-headers.conf emits it from
        # $newapp_hsts), so the application's copy is dropped: RFC 6797 makes a browser honour only
        # the FIRST Strict-Transport-Security it sees, and a helmet default (one year) would silently
        # beat this host's policy. The framework banner has no business reaching a browser. The rest
        # are dead headers (Expect-CT, Public-Key-Pins, Feature-Policy, Pragma) or ones whose only
        # safe value is "0" (a stale `X-XSS-Protection: 1; mode=block` re-enables a removed auditor
        # that itself introduced XSS), and SourceMap points a browser at source maps in production.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Expect-CT;
        proxy_hide_header Public-Key-Pins;
        proxy_hide_header Feature-Policy;
        proxy_hide_header SourceMap;
        proxy_hide_header X-SourceMap;

        # The proxy timeouts are NOT here. They live in app-tuning.conf at SERVER context, so a location
        # may override them (newapp --read-timeout, /socket.io/, proxy-stream.conf) without the fatal
        # "directive is duplicate" that a location-level default beside a location-level override is.
        # --- end proxy-common.conf ---
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # --request-buffering off: bodies stream to the app
        gzip off;   # --gzip off: never compress this site's responses (BREACH)
        limit_req zone=general burst=40 nodelay;
    }

    # Streaming (server-sent events / a WebSocket path with long silences): put a location
    # like this one in an --include file and adjust the path. The snippet default
    # proxy_read_timeout is 120s, which cuts off a slow model response mid-stream.
    # location /api/stream/ {
    #     proxy_pass http://127.0.0.1:5000;
    #     # --- proxy-common.conf (inlined; an installed host includes /etc/nginx/snippets/proxy-common.conf) ---
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade            $http_upgrade;
    #     proxy_set_header Connection         $connection_upgrade;
    #     proxy_set_header Host               $host;
    #     proxy_set_header X-Real-IP          $remote_addr;
    #     proxy_set_header X-Forwarded-For    $remote_addr;
    #     proxy_set_header X-Forwarded-Proto  $scheme;
    #     proxy_set_header X-Forwarded-Host   $host;
    #     proxy_set_header X-Forwarded-Port   $server_port;
    #     proxy_set_header X-Request-ID       $request_id;
    #     proxy_set_header Proxy              "";
    #     proxy_set_header Forwarded          "";
    #     proxy_set_header True-Client-IP     "";
    #     proxy_set_header X-Client-IP        "";
    #     proxy_set_header CF-Connecting-IP   "";
    #     proxy_set_header X-Original-URL     "";
    #     proxy_set_header X-Rewrite-URL      "";
    #     proxy_hide_header Strict-Transport-Security;
    #     proxy_hide_header X-Powered-By;
    #     proxy_hide_header X-XSS-Protection;
    #     proxy_hide_header Expect-CT;
    #     proxy_hide_header Public-Key-Pins;
    #     proxy_hide_header Feature-Policy;
    #     proxy_hide_header SourceMap;
    #     proxy_hide_header X-SourceMap;
    #     # --- end proxy-common.conf ---
    #     # --- proxy-stream.conf (inlined; an installed host includes /etc/nginx/snippets/proxy-stream.conf) ---
    #     proxy_buffering off;
    #     proxy_request_buffering off;
    #     proxy_cache off;
    #     chunked_transfer_encoding on;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    #     # --- end proxy-stream.conf ---
    # }
}
