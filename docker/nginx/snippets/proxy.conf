# golden: nginx-golden inner proxy v1 (2026-09-24)
# Include in every location that proxies. proxy_set_header inherits all-or-nothing too, so one extra
# proxy_set_header written in a location would silently drop every line below.
#
# This is the INNER hop. The host nginx in front (rendered by newapp) is the trust boundary: it SET
# X-Forwarded-For to the client it observed and blanked the headers a client could forge. This hop
# APPENDS its own peer to the chain (Express `trust proxy` = 2 then resolves the client) and passes
# X-Real-IP, X-Forwarded-Host, X-Forwarded-Port and X-Request-ID through untouched: nginx forwards
# every request header it does not redefine, so they need no line here.
proxy_http_version 1.1;
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $forwarded_proto;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;
proxy_set_header Proxy              "";
# The proxy timeouts are set at http level in nginx.conf, so a location may override them
# (/socket.io/ does) without a "directive is duplicate" error.
