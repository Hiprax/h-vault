# golden: nginx-golden inner headers v1 (2026-09-24)
# Include in server {} AND in every location that adds a header of its own: a location with any
# add_header inherits none from the server (all-or-nothing), which is how a cache header silently
# strips the security set. Values come from the $fb_* maps in nginx.conf: empty when the upstream
# already sent the header, so the application's own value wins and nothing is doubled.
add_header X-Frame-Options                    $fb_x_frame_options                    always;
add_header X-Content-Type-Options             $fb_x_content_type_options             always;
add_header Referrer-Policy                    $fb_referrer_policy                    always;
add_header Permissions-Policy                 $fb_permissions_policy                 always;
add_header Cross-Origin-Opener-Policy         $fb_cross_origin_opener_policy         always;
add_header Cross-Origin-Resource-Policy       $fb_cross_origin_resource_policy       always;
add_header X-Permitted-Cross-Domain-Policies  $fb_x_permitted_cross_domain_policies  always;
