# h-vault under PM2, the locations the host nginx adds to its rendered site (installed at
# /etc/nginx/sites-local/hvault-pm2.conf and pulled in by `include`). Express serves the SPA
# itself in this mode, so the site's own `location /` already proxies everything to 127.0.0.1:5000.
# This adds what the Docker tier's inner nginx would otherwise provide for the bundle: a one-year
# immutable lifetime for the content-hashed output and compression for it, both of which the site
# is otherwise rendered WITHOUT (`--gzip off`: every other response is dynamic, and compressing a
# secret-bearing dynamic response is the BREACH class of attack).
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:5000;
    # --- proxy-common.conf (inlined; an installed host includes /etc/nginx/snippets/proxy-common.conf) ---
    # Forwarded-header set for a reverse-proxied site. Include INSIDE the location that proxies.
    #
    # Two facts decide everything in this file (nginx.org, ngx_http_proxy_module):
    #   1. nginx forwards EVERY client request header it does not redefine. Only Host and
    #      Connection are rewritten by default, so a client-supplied X-Forwarded-Host,
    #      Forwarded, True-Client-IP or X-Original-URL reaches the application untouched --
    #      and Express derives req.hostname from X-Forwarded-Host once `trust proxy` is on.
    #   2. A header set to an empty string is NOT passed. That is how a forgeable header is
    #      removed: set it to "".
    # So this hop, the outermost trusted proxy, SETS every trust-carrying header from what it
    # observed itself and BLANKS every one a client could have invented.
    #
    # On distribution nginx (1.18 to 1.28) the proxy defaults are still HTTP/1.0 and
    # `Connection: close`; mainline 1.29.7+ changed them. Written explicitly so the behaviour
    # does not depend on which nginx runs it.
    proxy_http_version 1.1;

    # WebSocket upgrade. $connection_upgrade is the map in conf.d/00-newapp-http.conf: "upgrade"
    # for a handshake, EMPTY for an ordinary request -- empty rather than "close", so an upstream
    # keepalive pool, where one exists, is not torn down on every request.
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;

    # X-Forwarded-For is SET, not appended. $proxy_add_x_forwarded_for appends the peer to
    # whatever the client sent, so the LEFTMOST entry becomes attacker-controlled -- and an
    # application that rate-limits on the leftmost entry is then trivially bypassed. nginx is
    # the trust boundary on this host; behind a CDN the realip module has already rewritten
    # $remote_addr from the CDN's own header using the trusted CDN ranges (and Cloudflare itself
    # APPENDS to a client-sent X-Forwarded-For, so extending its value would carry the forgery).
    # $remote_addr is therefore the real client in BOTH topologies and the chain starts here.
    #
    # The in-container nginx behind this port then APPENDS its peer, so an Express app behind
    # both sees "<client>, <docker gateway>" and `trust proxy` = 2 resolves the client. A FastAPI
    # app must list the compose network's subnet in FORWARDED_ALLOW_IPS for the same reason.
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;

    # One correlation id per request, minted here so it can be trusted, logged by nginx (see the
    # log_format in conf.d) and echoed to the client by security-headers.conf. Never the client's
    # own value: a client-chosen id is a log-injection vector for every consumer downstream.
    proxy_set_header X-Request-ID       $request_id;

    # Blanked: nothing legitimate reaches an application through these, and each is a way for a
    # client to be someone else. `Proxy` is httpoxy; `Forwarded` (RFC 7239) is not emitted by this
    # host and would otherwise arrive as the client wrote it; True-Client-IP / X-Client-IP /
    # CF-Connecting-IP are the IP headers other proxies use (the real client is already in
    # X-Forwarded-For and X-Real-IP above -- behind Cloudflare the realip module consumed
    # CF-Connecting-IP before it got here); X-Original-URL / X-Rewrite-URL are the IIS/ASP.NET
    # path-override headers that some frameworks still honour.
    proxy_set_header Proxy              "";
    proxy_set_header Forwarded          "";
    proxy_set_header True-Client-IP     "";
    proxy_set_header X-Client-IP        "";
    proxy_set_header CF-Connecting-IP   "";
    proxy_set_header X-Original-URL     "";
    proxy_set_header X-Rewrite-URL      "";

    # Response side. HSTS is OWNED by this layer (security-headers.conf emits it from
    # $newapp_hsts), so the application's copy is dropped: RFC 6797 makes a browser honour only
    # the FIRST Strict-Transport-Security it sees, and a helmet default (one year) would silently
    # beat this host's policy. The framework banner has no business reaching a browser. The rest
    # are dead headers (Expect-CT, Public-Key-Pins, Feature-Policy, Pragma) or ones whose only
    # safe value is "0" (a stale `X-XSS-Protection: 1; mode=block` re-enables a removed auditor
    # that itself introduced XSS), and SourceMap points a browser at source maps in production.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Expect-CT;
    proxy_hide_header Public-Key-Pins;
    proxy_hide_header Feature-Policy;
    proxy_hide_header SourceMap;
    proxy_hide_header X-SourceMap;

    # The proxy timeouts are NOT here. They live in app-tuning.conf at SERVER context, so a location
    # may override them (newapp --read-timeout, /socket.io/, proxy-stream.conf) without the fatal
    # "directive is duplicate" that a location-level default beside a location-level override is.
    # --- end proxy-common.conf ---
    # --- security-headers.conf (inlined; an installed host includes /etc/nginx/snippets/security-headers.conf) ---
    # The response-header floor for every :443 server block, and for every LOCATION that declares
    # an add_header of its own.
    #
    # THE INHERITANCE RULE THIS FILE EXISTS FOR: nginx inherits add_header directives into a
    # location only when that location declares none. A location that sets so much as a
    # Cache-Control therefore silently drops every server-level header -- HSTS included -- from
    # exactly the responses it serves. So this file is included at server level AND re-included
    # inside any location that adds a header (newapp does that for a static site's /assets/ and
    # index.html; an --include file must do it for its own locations). `add_header_inherit merge`
    # would make that unnecessary, but it arrived in nginx 1.29.3 and no supported host has it.
    #
    # EVERY value below is a variable defined in conf.d/00-newapp-http.conf. Each is the policy
    # when the proxied application sent no such header, and the empty string -- which add_header
    # does not emit -- when it did. The application therefore always wins when it has an opinion,
    # and there is never a duplicate. HSTS is the exception in the other direction: the TLS
    # terminator owns it outright (proxy-common.conf hides the application's copy), and its
    # variable is a per-server default a site may lower with `newapp --hsts`.
    add_header Strict-Transport-Security      $newapp_hsts                          always;
    add_header Content-Security-Policy        $newapp_csp                           always;
    add_header X-Frame-Options                $newapp_x_frame_options               always;
    add_header X-Content-Type-Options         $newapp_x_content_type_options        always;
    add_header Referrer-Policy                $newapp_referrer_policy               always;
    add_header Permissions-Policy             $newapp_permissions_policy            always;
    add_header Cross-Origin-Opener-Policy     $newapp_cross_origin_opener_policy    always;
    add_header Cross-Origin-Resource-Policy   $newapp_cross_origin_resource_policy  always;
    add_header X-Permitted-Cross-Domain-Policies $newapp_x_permitted_cross_domain_policies always;
    add_header X-DNS-Prefetch-Control          $newapp_x_dns_prefetch_control        always;

    # The correlation id proxy-common.conf minted for this request, echoed so a support ticket
    # can quote it, and Retry-After on a 429 (empty, hence absent, on every other status).
    add_header X-Request-ID                   $request_id                           always;
    add_header Retry-After                    $newapp_retry_after                   always;

    # Deliberately ABSENT:
    #   X-XSS-Protection   the browser XSS auditor it controlled is gone from every current
    #                      engine; the header is deprecated and CSP is the control. An application
    #                      that still sends "0" is passed through untouched.
    #   Vary               gzip_vary in compression.conf emits Vary: Accept-Encoding on compressed
    #                      responses; a blanket "Vary: Origin" on every response fragments caches
    #                      for nothing, and an application that serves CORS sets its own.
    # --- end security-headers.conf ---
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip            on;
    gzip_types      application/javascript text/javascript text/css image/svg+xml application/wasm;
    access_log      off;
}
