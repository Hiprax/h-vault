# managed-by: newapp
# STANDALONE copy for a host WITHOUT newapp: install as /etc/nginx/conf.d/00-newapp-http.conf,
# ONCE per host. Every site rendered for this host references these names; a second copy
# under another name is a duplicate zone/map and nginx refuses to start.
# HTTP-context directives that must exist EXACTLY ONCE host-wide.
#
# These previously lived inside provision.sh's per-domain site file, which is correct for a
# single site and fatal for a second one: a second site file redefining them yields
#   nginx: [emerg] the duplicate "connection_upgrade" variable
#   nginx: [emerg] limit_req "general" is already bound to key ...
# and nginx does not start. Every name here is a CONTRACT with the snippets and with every
# vhost newapp renders; tools/zone-contract-gate.sh asserts the three copies agree (this file,
# provision.sh's degraded-path placeholder, and the rendered vhost).
#
# `map` is the one http-context object nginx does NOT refuse to duplicate: a second file
# defining the same variable silently wins by file-name order. That is why every variable
# below carries the newapp_ prefix and why per-application files in conf.d must never redefine
# one of them.

# The shipped mime.types has no .mjs and no .webmanifest (every nginx version through master), and
# the header floor sends nosniff on everything, so an unmapped ES module or PWA manifest served by
# a --static site is BLOCKED by the browser. Only the two missing extensions are added; remapping an
# existing one is a "duplicate extension" warning on every nginx -t for no browser benefit.
types {
    application/javascript     mjs;
    application/manifest+json  webmanifest;
}

limit_req_status 429;
limit_conn_status 429;

# Keyed on $binary_remote_addr in BOTH topologies. Behind a CDN the realip module has already
# replaced the client address from the CDN's header using the trusted CDN ranges, so this is
# the real client and -- unlike the raw CDN header -- it cannot be forged by anyone who
# reaches the origin address directly. realip runs in the POST_READ phase and these limits in
# PREACCESS, so the substitution always happens first -- provided realip stays at http level.
# Sizing: a 10m zone holds roughly 80 000 states on a 64-bit host; the least recently used
# state is evicted when it fills, so a flood cannot lock the zone.
limit_req_zone $binary_remote_addr zone=general:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=socket:10m rate=20r/s;
# Webhooks (Stripe/GitHub/...) burst far higher than logins; give them a roomy zone so
# legitimate provider bursts and backlog replays are not 429'd. Authenticity is enforced by
# the application's signature check, not by this rate limit.
limit_req_zone $binary_remote_addr zone=webhook:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;
# 100 concurrent requests per address, not 20: under HTTP/2 and HTTP/3 every concurrent request
# counts as a connection, so one page load fetching thirty resources in parallel, or a NAT'd
# office holding a WebSocket per user, sat inside a 20 with no room for the next click. 100 still
# bounds a flood; a site whose visitors share one address raises it at server level (an --include
# line `limit_conn addr N;` replaces this value for that site alone).
limit_conn addr 100;

# limit_req cannot attach Retry-After itself; a header filter keyed on the status can.
# security-headers.conf emits `add_header Retry-After $newapp_retry_after always;`, and an
# empty value is simply not sent, so every response that is not a 429 carries nothing.
map $status $newapp_retry_after {
    default '';
    429     '5';
}

# WebSocket upgrade. "upgrade" for a handshake; EMPTY -- not "close" -- for an ordinary
# request. An empty value makes nginx omit the Connection header, which is what lets an
# upstream keepalive pool be reused; "close", the value most copied snippets carry, retires
# the pooled connection after every single response.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# HSTS, owned by this layer because only the TLS terminator can honestly promise a browser
# that the origin is reachable over HTTPS. Two years with includeSubDomains, which is what
# both OWASP sources publish. NO `preload` by default: hstspreload.org itself asks projects
# that generate configuration not to include it ("HSTS preloading is not recommended"), and
# the OWASP Secure Headers Project keeps it out for the same reason -- it commits every
# current and future subdomain to HTTPS and removal from the browser lists takes months.
# security-headers.conf emits `add_header Strict-Transport-Security $newapp_hsts always;`; a
# site that opts DOWN (`newapp --hsts short|off`) or UP (`--hsts preload`, once the domain is
# ready to be submitted) assigns the variable in its own server block with `set`, which
# overrides this default for that server only.
map $host $newapp_hsts {
    default "max-age=63072000; includeSubDomains";
}

# Security headers as a FLOOR, not a ceiling. Each map yields the policy value when the
# proxied application sent no such header, and the EMPTY string -- which add_header does not
# emit -- when it did. So an application that knows its needs (a per-request CSP nonce, COOP
# same-origin-allow-popups for an OAuth popup, an X-Frame-Options that permits its own
# widget) keeps its own header, exactly once, while an application that sends nothing, a
# static site, a redirect and an nginx-generated error page all get the baseline. Browsers
# treat two conflicting copies of these headers badly (two CSPs are intersected, two
# X-Frame-Options may both be ignored), which is what this construction prevents.
map $upstream_http_content_security_policy $newapp_csp {
    # Deliberately permissive for a GENERIC application host: it permits 'unsafe-inline' and
    # 'unsafe-eval' so a stock React/MERN bundle loads unmodified. This is the floor an
    # application gets for sending nothing; the application that emits its own strict,
    # nonce-based policy replaces it entirely (see above). object-src 'none', frame-ancestors,
    # base-uri and form-action still hold.
    ''      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' https: data:; connect-src 'self' https: wss:; media-src 'self' https: blob:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests";
    default "";
}
# DENY, as OWASP recommends, and consistent with the floor CSP's frame-ancestors 'none':
# browsers that understand frame-ancestors ignore X-Frame-Options, so the two must agree. A
# site that frames itself sends its own headers (or sets `$newapp_x_frame_options` to
# SAMEORIGIN in an --include file); a site that is embedded cross-origin sets both to "".
map $upstream_http_x_frame_options $newapp_x_frame_options {
    ''      "DENY";
    default "";
}
map $upstream_http_x_content_type_options $newapp_x_content_type_options {
    ''      "nosniff";
    default "";
}
map $upstream_http_referrer_policy $newapp_referrer_policy {
    ''      "strict-origin-when-cross-origin";
    default "";
}
# The sensor, capture, device and payment features denied; the UX features left at their
# browser defaults on purpose. `clipboard-write=()` breaks copy buttons, `fullscreen=()`
# breaks video players, `publickey-credentials-get=()` breaks passkey login, and the
# local-network family defaults to `self`, which is already the right posture. Dropped as
# dead or dying: `interest-cohort` (FLoC, never in the W3C feature list) and `browsing-topics`
# (Topics API removal staged in Chrome 150-152). Chromium-only header; unknown names are
# ignored by every engine, so a stale token costs nothing but noise.
map $upstream_http_permissions_policy $newapp_permissions_policy {
    ''      "accelerometer=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()";
    default "";
}
map $upstream_http_cross_origin_opener_policy $newapp_cross_origin_opener_policy {
    ''      "same-origin";
    default "";
}
map $upstream_http_cross_origin_resource_policy $newapp_cross_origin_resource_policy {
    ''      "same-origin";
    default "";
}
# Two small ones from the OWASP set: the Flash/Silverlight cross-domain policy file is dead
# but scanners still look for the header, and prefetch control closes an HTML-injection
# exfiltration channel in Chromium (the only engine that honours it).
map $upstream_http_x_permitted_cross_domain_policies $newapp_x_permitted_cross_domain_policies {
    ''      "none";
    default "";
}
map $upstream_http_x_dns_prefetch_control $newapp_x_dns_prefetch_control {
    ''      "off";
    default "";
}

# Uniquely-named format ('app_main', not 'main') so it can never collide with a log_format
# the packaged nginx.conf might define. The first nine fields are the standard `combined`
# format in the standard order, because fail2ban's access-log filters assume exactly that;
# the extra fields are APPENDED and never inserted. $request_id is the correlation id
# proxy-common.conf hands the application; $limit_req_status says PASSED/DELAYED/REJECTED so
# a rate-limit incident can be read from the access log rather than inferred.
log_format app_main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                '"$request_time" "$upstream_response_time" '
                'rid=$request_id lrs=$limit_req_status tls=$ssl_protocol/$ssl_cipher';

access_log /var/log/nginx/access.log app_main;
error_log  /var/log/nginx/error.log warn;
