# golden: nginx-golden inner v1 (2026-09-24)  routing for h-vault (the server block of nginx.conf)
# Installed as /etc/nginx/conf.d/default.conf by the `web` stage of docker/Dockerfile. The http
# context (worker count, /tmp paths, JSON log, MIME fixes, the header-floor maps, the `app` upstream,
# gzip, timeouts) is docker/nginx/nginx.conf; the proxy set and the floor are the two snippets.
#
# What is h-vault's here and not the golden template's: every HTML document is proxied to Express
# (`= /` and the `@app` fallback), so helmet owns the document headers and there is no index.html
# fallback; the bundle and the sandboxed viewer's assets are served from /srv/hvault with the
# literal headers a static response needs; `/sandbox-assets/` alone is readable cross-origin, because
# the document viewer runs in an opaque-origin iframe.

server {
    # IPv4 only, and deliberately so. A `listen [::]:8080` makes the image UNBUILDABLE on a host
    # whose kernel boots with ipv6.disable=1: socket(AF_INET6) fails with EAFNOSUPPORT, and
    # `nginx -t` genuinely opens every listening socket. Nothing is lost: the compose network is
    # IPv4, the one published port is 127.0.0.1:HVAULT_HTTP_PORT:8080, and a host published on an
    # IPv6 address still forwards INTO the bridge over IPv4.
    listen      8080;
    server_name _;

    # The client bundle, copied out of the build stage. The base image's own document root keeps its
    # "Welcome to nginx!" page, which must never answer for this site.
    root  /srv/hvault;

    include /etc/nginx/snippets/headers.conf;

    # This nginx is alive. The application's own health route is /api/v1/health (the compose
    # healthcheck), which the exact and fallback proxies below can never mask.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ^~ on every proxied and every static prefix, so that no regex location (the dotfile and dump
    # rules below) can steal /api/export.log or /assets/vendor.map from its owner.
    location ^~ /api/ {
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control $fb_api_cache_control always;
        gzip off;                                   # BREACH: dynamic responses are the risky class
        proxy_request_buffering off;                # a backup upload streams to Express as it arrives
        proxy_intercept_errors on;                  # only the codes named here are intercepted;
        error_page 502 503 504 = @api_5xx;          # the API's own 4xx JSON passes untouched
        proxy_pass http://app;
    }

    # Content-hashed build output: immutable for a year, compressed by this nginx. A file that is
    # not in the bundle falls through to Express, whose static mount does not have it either, so the
    # application shell answers: a 200 `text/html` that nosniff refuses as a script, and that is not
    # cached for a year (the immutable lifetime below applies only to what THIS location serves).
    # No `always` on the lifetime: a status other than 2xx/3xx must not be cached for a year.
    location ^~ /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control          "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'" always;
        access_log off;
        try_files  $uri @app;
    }

    # The document viewer runs in a sandboxed iframe with an OPAQUE origin, so its assets must be
    # readable cross-origin: CORS for the fetches, CORP `cross-origin` so the floor's `same-origin`
    # does not make the browser drop them. Written literally, the whole set, because a location
    # that adds any header inherits none, and the floor's CORP value would be the wrong one here.
    location ^~ /sandbox-assets/ {
        add_header Cache-Control                    "public, max-age=31536000, immutable";
        add_header Content-Security-Policy          "default-src 'self'"          always;
        add_header X-Frame-Options                  "DENY"                        always;
        add_header X-Content-Type-Options           "nosniff"                     always;
        add_header Referrer-Policy                  "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy               "accelerometer=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy       "same-origin"                 always;
        add_header X-Permitted-Cross-Domain-Policies "none"                       always;
        add_header Access-Control-Allow-Origin      "*"                           always;
        add_header Cross-Origin-Resource-Policy     "cross-origin"                always;
        access_log off;
        try_files  $uri @app;
    }

    # The service worker names the current hashes: revalidated on every check, never cached.
    location = /sw.js {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control           "no-cache"           always;
        add_header Content-Security-Policy "default-src 'self'" always;
        try_files  $uri @app;
    }

    # The shell is Express's (helmet sets its CSP, and the app decides what an unauthenticated
    # request sees). `try_files $uri @app` cannot do this for `/`: the URI is the document root
    # itself, which exists as a directory and, with index.html deliberately removed, would be a 403.
    location = / {
        include /etc/nginx/snippets/proxy.conf;
        gzip off;
        proxy_pass http://app;
    }

    # Never served from the bundle: dotfiles (except .well-known), source maps, backups and dumps.
    # 404, not 403: a refusal that confirms existence is information.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:map|bak|backup|old|orig|save|swp|tmp|sql|log)$ { return 404; }

    # Everything else: a file from the bundle if one exists (the manifest, icons, robots.txt, the
    # viewer document), otherwise Express, which renders the shell for a client-side route and its
    # own 404 for the rest. No index.html fallback here, on purpose.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control           "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'"                 always;
        try_files  $uri @app;
    }

    location @app {
        include /etc/nginx/snippets/proxy.conf;
        gzip off;
        proxy_pass http://app;
    }

    location @api_5xx {
        default_type application/json;
        return 502 '{"error":"bad_gateway","message":"the application is not reachable"}';
    }
}
