# golden: nginx-golden inner v1 (2026-09-24)  source: /mnt/storage/Projects/bash/newapp/container/nginx.golden.conf
# h-vault's in-container nginx: the stack's single serving surface, baked into the `web` stage of
# docker/Dockerfile FROM nginxinc/nginx-unprivileged (uid 101, port 8080, read-only rootfs with a tmpfs
# on /tmp). It REPLACES the image's nginx.conf; the server block lives in internal.conf, installed as
# conf.d/default.conf, and the two snippets in /etc/nginx/snippets/.
#
# Lines marked KNOB are the only ones this project changes. Everything else is policy: change it in
# the golden file first, re-copy, and keep the header line so drift stays greppable. TLS, HSTS and the
# trust boundary belong to the host nginx in front (docker/nginx/system.docker.example.conf); this
# layer routes, serves the bundle, fixes MIME types and fills the header floor helmet leaves empty.

pid                  /tmp/nginx.pid;
worker_processes     2;                    # explicit: `auto` counts the HOST's cores, not the cgroup quota
worker_rlimit_nofile 8192;
error_log            /var/log/nginx/error.log warn;   # the image links it to stderr

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # The shipped table has no .mjs and no .webmanifest (every version through master); with nosniff
    # an unmapped module script is BLOCKED by the browser. Only the two missing extensions are added:
    # remapping an existing one (js, wasm, avif) is a "duplicate extension" warning on every start
    # for no browser benefit. Never put a types{} block inside a location: it replaces the whole
    # table there.
    types {
        application/javascript     mjs;
        application/manifest+json  webmanifest;
    }
    charset       utf-8;
    charset_types text/xml text/plain text/css text/javascript application/javascript application/json application/rss+xml application/manifest+json;

    # Unprivileged image: every path nginx writes lives under /tmp (the tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # One JSON line per request to stdout (Docker's json-file driver rotates it: max-size/max-file).
    # Every value is quoted, because an empty variable would otherwise leave invalid JSON. The request
    # id is the HOST's ($http_x_request_id), so one id spans both nginx tiers and the application.
    log_format app_json escape=json
        '{"time":"$time_iso8601","request_id":"$http_x_request_id","host":"$host",'
        '"remote_addr":"$remote_addr","xff":"$http_x_forwarded_for",'
        '"method":"$request_method","uri":"$request_uri","status":"$status",'
        '"bytes":"$body_bytes_sent","request_time":"$request_time",'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log app_json;

    server_tokens     off;
    absolute_redirect off;   # a redirect must never carry this container's host:8080 to the client
    port_in_redirect  off;
    disable_symlinks  on;    # the bundle is COPYd, never symlinked
    autoindex         off;
    merge_slashes     on;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    # KNOB: a 30 MB backup restore (the largest body any route accepts) over the slowest link this
    # deployment stands behind. Matches HTTP_REQUEST_TIMEOUT_MS's reasoning in the app.
    client_body_timeout   120s;
    send_timeout          15s;
    reset_timedout_connection on;
    client_body_buffer_size     128k;
    large_client_header_buffers 4 16k;
    # KNOB: at least the application's own body limit (30 MB, the backup restore). The host nginx in
    # front allows the same (system.*.example.conf: 32M); the smallest of the three answers, and only
    # the app can explain a 413.
    client_max_body_size 32m;
    proxy_max_temp_file_size 0;   # a proxied response is streamed, never spooled to the tmpfs
    # Proxy timeouts at http level, so a location can override them without a "directive is
    # duplicate" error. KNOB: 300 s between two bytes, because a key rotation or a backup restore
    # legitimately runs for minutes and answers only at the end.
    proxy_connect_timeout 10s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/csv text/css text/javascript application/javascript application/json application/ld+json application/manifest+json application/wasm application/xml application/xhtml+xml application/rss+xml application/atom+xml image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;
    gzip_static     on;

    # Docker's embedded DNS answers with a 600 s TTL; `valid` overrides it so a re-created app
    # container is found within 10 s without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }
    # TLS ended at the host: honour its X-Forwarded-Proto; fall back to this hop's scheme when the
    # loopback port is hit directly (which already needs host access, so this is not a trust hole).
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        '~.'    $http_x_forwarded_proto;
    }

    # The header FLOOR, same mechanism as the host: emitted only when the response does not already
    # carry the header (an add_header whose value is empty is not sent), so helmet's values win and
    # nothing is ever doubled. HSTS is deliberately absent: it belongs to the TLS terminator. There is
    # no document-CSP map either: every HTML document is proxied to Express, whose helmet owns it.
    map $upstream_http_x_frame_options                   $fb_x_frame_options                   { '' "DENY"; default ""; }
    map $upstream_http_x_content_type_options            $fb_x_content_type_options            { '' "nosniff"; default ""; }
    map $upstream_http_referrer_policy                   $fb_referrer_policy                   { '' "strict-origin-when-cross-origin"; default ""; }
    map $upstream_http_permissions_policy                $fb_permissions_policy                { '' "accelerometer=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()"; default ""; }
    map $upstream_http_cross_origin_opener_policy        $fb_cross_origin_opener_policy        { '' "same-origin"; default ""; }
    map $upstream_http_cross_origin_resource_policy      $fb_cross_origin_resource_policy      { '' "same-origin"; default ""; }
    map $upstream_http_x_permitted_cross_domain_policies $fb_x_permitted_cross_domain_policies { '' "none"; default ""; }
    # API responses are personal: no-store unless the application said otherwise.
    map $upstream_http_cache_control                     $fb_api_cache_control                 { '' "no-store"; default ""; }

    # KNOB: the compose service name and the port the application binds (HOST=0.0.0.0 inside).
    # `resolve` re-resolves in the background and lets nginx start before the service exists.
    upstream app {
        zone app 64k;
        server hvault-app:5000 resolve;
        keepalive 32;
    }

    # The server block: docker/nginx/internal.conf, installed as conf.d/default.conf.
    include /etc/nginx/conf.d/*.conf;
}
