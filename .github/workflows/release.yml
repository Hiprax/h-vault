name: Release

# The only workflow in this repository. It does three things, in this order: it
# runs the whole gauntlet; then, only if the gauntlet passed and this commit is
# genuinely a release, it builds the release images for both platforms, scans
# and runs them, and publishes them; and only once anyone can pull those images
# does it tag the commit and publish the Release.
#
# It used to be gated on nothing, on the argument that a commit reaching `main`
# had already passed everything through the pre-push hook. That argument does
# not survive contact with CONTRIBUTING.md, whose "Escape hatches" table
# documents three supported ways past that hook — skipping named gates, a push
# flag, and an environment variable that disables every hook. Any of them puts
# an unverified commit on `main`, and the release published it without a single
# check having run anywhere. This repository is public, so
# hosted minutes are free and uncapped: re-running the gauntlet here costs
# nothing and is the only thing that makes "every published release was built
# from a commit that passed" a fact rather than an assumption.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage_images:
        description: >-
          Rehearse the image jobs: run the gauntlet, then build, scan and smoke-test the
          images on both platforms and push them by digest only. No tag, no attestation,
          no release. Anyone who can see the packages can pull those untagged
          digests.
        type: boolean
        default: false

# No workflow-level `permissions` block, deliberately: one would be inherited by
# EVERY job, and `verify` runs third-party code (`npm ci` executes every
# dependency's install script, then the whole gauntlet runs). Each job declares
# its own scopes below: `verify` and `plan` read; the two image jobs may push
# untagged images; `publish-images` may also tag them and sign their provenance
# (with GitHub's own attestation action); and only `release`, which runs nothing
# but this repository's own scripts, may push a git tag and publish a Release.
#
# Supply chain: every `uses:` is pinned to a full commit SHA (a tag can be moved
# by whoever controls the action's repository; a commit id cannot), with the
# release it names in a trailing comment, and every binary this workflow
# downloads is checked against a SHA-256 committed here before it is installed.
# The BuildKit image the image jobs build with is pinned by digest, and so are
# the base images and the Dockerfile frontend those builds pull (see
# docker/Dockerfile); what is not pinned (the Alpine packages `apk upgrade`
# installs, Trivy's vulnerability database) is listed in SECURITY.md. CONTRIBUTING.md,
# "Refreshing the release workflow's pins", is the procedure for moving any of
# them.
#
# The runner image is named, never `ubuntu-latest`: that label moves to a new
# Ubuntu release on GitHub's schedule, which would change the operating system,
# kernel and Docker the gauntlet runs on without a commit here. Every job runs on
# `ubuntu-26.04`, the release the local gauntlet is run on, except the one that
# builds the 64-bit ARM images, which runs on the same release's native ARM image
# (`ubuntu-26.04-arm`) rather than under emulation. Moving off either is a
# deliberate edit like any other pin. actionlint's built-in list of hosted
# labels predates both, so `.github/actionlint.yaml` declares them; delete that
# file once an actionlint release knows them.

# Serialised, and deliberately NOT cancel-in-progress. Two pushes landing
# seconds apart would otherwise both read the same tag state and race, and the
# loser fails with a red X. Serialised, the second run starts after the first
# has pushed its tag and sees it. A staging rehearsal has a group of its own: it
# publishes nothing, and GitHub replaces a PENDING run in a group when another
# one queues behind it, so sharing the group would let a rehearsal displace a
# release waiting its turn.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.stage_images && 'release-stage' || 'release' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gauntlet. Identical to what the pre-push hook runs — `npm run ci`, the
  # T0 and T1 tiers — so there is one definition of "verified" and this job
  # cannot drift into checking less than the hook does.
  #
  # The six host binaries below are gate PREREQUISITES (actionlint, hadolint,
  # oasdiff, the two security scanners gitleaks and osv-scanner, and diff-cover):
  # `local-ci.mjs` declares them per gate and reports a missing one as "could not
  # run" (exit 2) rather than as a pass, so leaving any of them out would turn
  # this job red instead of quietly shrinking it. CodeQL is deliberately not
  # installed: `sast` is the one gate allowed to report itself SKIPPED, and it
  # falls back to the ESLint security baseline that `lint` already enforces.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (the full local gauntlet)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    # Read-only: this job publishes nothing, and it is the one that runs code
    # this repository did not write.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan's history leg reads every blob ever committed, and
          # the coverage gate diffs against `main`. Both need the whole history.
          fetch-depth: 0
          # Otherwise the job token is written into .git/config, where every
          # later step (every install script under `npm ci` included) can read
          # it. This job pushes nothing, so it keeps nothing.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each binary is downloaded to a file and checked against the SHA-256
      # committed on the line after it; `set -e` stops the step on a mismatch,
      # before anything is unpacked or run. Each hash is the one its project
      # publishes beside the asset (that file's URL is the comment above each
      # check), confirmed against GitHub's own asset digest and a download of the
      # same file. Bumping a *_VERSION without its hash fails here, loudly.
      - name: Install the gate prerequisites
        env:
          ACTIONLINT_VERSION: 1.7.12
          HADOLINT_VERSION: 2.14.0
          OASDIFF_VERSION: 1.28.0
          GITLEAKS_VERSION: 8.30.1
          OSV_SCANNER_VERSION: 2.4.0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cd "$(mktemp -d)"

          curl -fsSL -o "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check --strict -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C "$HOME/.local/bin" actionlint

          curl -fsSL -o hadolint-linux-x86_64 \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          # https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64.sha256
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  hadolint-linux-x86_64" | sha256sum --check --strict -
          install -m 0755 hadolint-linux-x86_64 "$HOME/.local/bin/hadolint"

          curl -fsSL -o "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          # https://github.com/oasdiff/oasdiff/releases/download/v1.28.0/checksums.txt
          echo "e0ef076f2cf953d922addc04be9c3851cf3ec18f7678d2b94d44cea23dca51b5  oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | sha256sum --check --strict -
          tar xzf "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" -C "$HOME/.local/bin" oasdiff

          curl -fsSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum --check --strict -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks

          curl -fsSL -o osv-scanner_linux_amd64 \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          # https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_SHA256SUMS
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  osv-scanner_linux_amd64" | sha256sum --check --strict -
          install -m 0755 osv-scanner_linux_amd64 "$HOME/.local/bin/osv-scanner"

      # From a committed, hash-locked requirements file that pins diff-cover AND
      # every package it imports (scripts/ci/requirements-diff-cover.txt,
      # compiled from the .in beside it). `--require-hashes` refuses any archive
      # whose hash is not in that file, `--no-deps` refuses to resolve anything
      # it does not list, `--only-binary=:all:` refuses an sdist (whose build
      # backend would be fetched and run unverified), and `pip check` proves the
      # list complete. Not `pipx install --pip-args=…`: pipx passes its package
      # as a positional requirement, which carries no hash, so pip refuses the
      # whole install in hash-checking mode. Only the entry point is linked onto
      # PATH; the venv's own `python3`/`pip` must not shadow the runner's.
      - name: Install diff-cover from its hash-locked requirements
        run: |
          set -euo pipefail
          python3 -m venv "$HOME/.diff-cover"
          "$HOME/.diff-cover/bin/pip" install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: \
            -r scripts/ci/requirements-diff-cover.txt
          "$HOME/.diff-cover/bin/pip" check
          ln -sf "$HOME/.diff-cover/bin/diff-cover" "$HOME/.local/bin/diff-cover"
          diff-cover --version

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # Every gate tees its own transcript, and the runner prints the failing
      # ones, so a red run is diagnosed from the job log. The reports are
      # deliberately NOT uploaded as an artifact: artifact and cache storage is
      # the one part of Actions this repository has never spent anything on, and
      # `local-pipeline.test.ts` keeps it that way.
      - name: Run the gauntlet
        run: npm run ci

  # ---------------------------------------------------------------------------
  # The plan: is this commit a release, and what do the image jobs do?
  #
  # Decided once, up front, so the image jobs can be skipped outright rather than
  # started to discover they have nothing to do. The decision is
  # `planImages` in scripts/ci/lib/release-images.mjs, unit-tested: images are
  # built for a release that is due, not yet tagged, on `main`, or for a staging
  # rehearsal; they are published only for the first. `stage_images` reaches the
  # script as the exact words true/false: compared with the STRING 'true', a
  # boolean input is always false, which would turn a rehearsal into a run that
  # builds nothing and still passes.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan the release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
      create_tag: ${{ steps.version.outputs.create_tag }}
      stage: ${{ steps.images.outputs.stage }}
      build: ${{ steps.images.outputs.build }}
      publish: ${{ steps.images.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release decision reads every existing tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide the release
        id: version
        run: |
          git fetch --tags --force --quiet
          node scripts/ci/next-version.mjs

      - name: Decide what the image jobs do
        id: images
        env:
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          CREATE_TAG: ${{ steps.version.outputs.create_tag }}
          STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage_images == true }}
        run: node scripts/ci/release-images.mjs plan

  # ---------------------------------------------------------------------------
  # The release images, one job per platform, each on a native runner.
  #
  # Each builds hvault-app, hvault-web and hvault-bootstrap from this commit in
  # ONE bake (so the app and the Nginx image provably share one client build),
  # pushes them by digest with no tag, pulls them back, drops the registry
  # credential, scans the pulled bytes (Trivy, pinned by digest, from a saved
  # tarball: no Docker socket and no credential reach it) and runs them: the real
  # docker-compose.yml, a real user journey through its one port. Only the
  # digests leave the job, as job outputs; nothing can pull these images by name
  # until `publish-images` tags them.
  #
  # Only this repository's own scripts run on the host here, with Node and the
  # docker CLI the runner image ships; the third-party build tooling runs inside
  # BuildKit's build containers, which never see the registry token, and the
  # scanner gets a saved tarball and nothing else.
  # ---------------------------------------------------------------------------
  images-amd64:
    name: Images (linux/amd64)
    needs: [verify, plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.build.outputs.app }}
      web: ${{ steps.build.outputs.web }}
      bootstrap: ${{ steps.build.outputs.bootstrap }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The image metadata names this commit, and its time comes from git.
          fetch-depth: 0
          persist-credentials: false

      - name: Sign in to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Create the pinned BuildKit builder
        run: |
          set -euo pipefail
          docker buildx create --name hvault-release --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          docker buildx inspect --bootstrap hvault-release

      - name: Build, push by digest, scan and smoke-test the images
        id: build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          node scripts/ci/release-images.mjs build --platform linux/amd64
          --version "$VERSION" --revision "$GITHUB_SHA" --builder hvault-release

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  images-arm64:
    name: Images (linux/arm64)
    needs: [verify, plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.build.outputs.app }}
      web: ${{ steps.build.outputs.web }}
      bootstrap: ${{ steps.build.outputs.bootstrap }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The image metadata names this commit, and its time comes from git.
          fetch-depth: 0
          persist-credentials: false

      - name: Sign in to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Create the pinned BuildKit builder
        run: |
          set -euo pipefail
          docker buildx create --name hvault-release --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          docker buildx inspect --bootstrap hvault-release

      - name: Build, push by digest, scan and smoke-test the images
        id: build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          node scripts/ci/release-images.mjs build --platform linux/arm64
          --version "$VERSION" --revision "$GITHUB_SHA" --builder hvault-release

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  # ---------------------------------------------------------------------------
  # Publishing the images: only after BOTH platforms passed, only for a release.
  #
  # One index per image joins its two platform digests and is tagged with the
  # release version, annotated with where it came from. The script refuses when
  # git already has the release tag, so a released version's images are never
  # replaced. Each index then gets a signed SLSA build-provenance attestation
  # (Sigstore, through GitHub's own action) stored beside it in the registry,
  # which `gh attestation verify` checks against this repository and workflow.
  # ---------------------------------------------------------------------------
  publish-images:
    name: Publish the images
    needs: [plan, images-amd64, images-arm64]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      app: ${{ steps.publish.outputs.app }}
      web: ${{ steps.publish.outputs.web }}
      bootstrap: ${{ steps.publish.outputs.bootstrap }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The refusal to replace a released version reads every existing tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Sign in to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Join both platforms into one tagged index per image
        id: publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          AMD64_DIGESTS: ${{ toJSON(needs.images-amd64.outputs) }}
          ARM64_DIGESTS: ${{ toJSON(needs.images-arm64.outputs) }}
        run: node scripts/ci/release-images.mjs publish --version "$VERSION" --revision "$GITHUB_SHA"

      - name: Attest the provenance of hvault-app
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hiprax/hvault-app
          subject-digest: ${{ steps.publish.outputs.app }}
          push-to-registry: true
          # Storage records exist only for organisation-owned repositories.
          create-storage-record: false

      - name: Attest the provenance of hvault-web
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hiprax/hvault-web
          subject-digest: ${{ steps.publish.outputs.web }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the provenance of hvault-bootstrap
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hiprax/hvault-bootstrap
          subject-digest: ${{ steps.publish.outputs.bootstrap }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  # ---------------------------------------------------------------------------
  # The release. Runs only after the gauntlet is green, never in a rehearsal,
  # and, when this run published images, only after that succeeded. Only on
  # `main`, or on exactly this release's own tag (`refs/tags/v<version>`): a
  # dispatch there is how an interrupted release is healed once `main` has moved
  # on. A run that did not publish the images itself never creates a tag (see
  # "Create the tag"), so on that tag all it can do is check that the published
  # images name this version and this commit, and reconcile the Release.
  # `!cancelled()` because `publish-images` is legitimately SKIPPED on every push
  # that releases nothing, and on a re-run of an already-tagged commit (which
  # rebuilds nothing), and a plain `needs` would skip this job along with it: the
  # "nothing to release" report and the heal of an interrupted release live here.
  # ---------------------------------------------------------------------------
  release:
    name: Tag and release
    needs: [verify, plan, publish-images]
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && needs.plan.result == 'success'
      && needs.plan.outputs.stage == 'false'
      && (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/v{0}', needs.plan.outputs.version))
      && (needs.publish-images.result == 'success'
      || (needs.publish-images.result == 'skipped' && needs.plan.outputs.publish == 'false'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The minimum that lets GITHUB_TOKEN push a tag and publish a Release, and
    # only here: this job installs nothing and runs only this repository's own
    # scripts. Every other scope is dropped, including the
    # `security-events: write` the deleted CodeQL job needed.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release decision reads every existing tag, so a shallow clone
          # (the default) would see none and re-mint a version already released.
          # Credentials stay persisted HERE, unlike in `verify`: the tag push
          # below authenticates with them.
          fetch-depth: 0

      # Answers two questions at once, and refuses rather than guessing when
      # they disagree: is this commit a release, and under which tag?
      #
      # `package.json` is the version of truth — `scripts/inject-version.js`
      # compiles it into APP_VERSION, which `/health` and the OpenAPI document
      # both serve — so the tag follows it and never leads it. An ordinary push
      # that bumped nothing sets `should_release=false` and publishes nothing;
      # a tag series that has run AHEAD of package.json exits non-zero, because
      # publishing v0.9.1 from an artifact reporting 0.8.0 is the exact defect
      # this step exists to stop. See scripts/ci/lib/version.mjs (planRelease).
      - name: Decide the release
        id: version
        run: |
          git fetch --tags --force --quiet
          node scripts/ci/next-version.mjs

      # The `plan` job made the same decision before the images were built. They
      # may differ on a retry of this job alone, after an attempt that pushed the
      # tag (allowed: that is the heal), and otherwise only if the decision no
      # longer holds; `decisionChangeProblem` in scripts/ci/lib/release-images.mjs
      # says which, and nothing is tagged then.
      - name: Refuse a decision that changed since the plan
        env:
          PLANNED_VERSION: ${{ needs.plan.outputs.version }}
          PLANNED_SHOULD_RELEASE: ${{ needs.plan.outputs.should_release }}
          PLANNED_CREATE_TAG: ${{ needs.plan.outputs.create_tag }}
          OWN_VERSION: ${{ steps.version.outputs.version }}
          OWN_SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          OWN_CREATE_TAG: ${{ steps.version.outputs.create_tag }}
        run: node scripts/ci/release-images.mjs agree

      # A Release is never published while its install instructions cannot
      # work: every image tag must be pullable by an ANONYMOUS client, hold both
      # platforms and be annotated with this version and THIS commit, and when
      # this run published them, be exactly the index it published. A package
      # this workflow creates takes the repository's visibility; one that is
      # private (pushed by hand, or in a private fork) fails here, naming its
      # settings page, until it is made public.
      - name: Check that anyone can pull the release images
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ needs.plan.outputs.publish }}
          EXPECTED_INDEXES: ${{ toJSON(needs.publish-images.outputs) }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" = "true" ]; then
            node scripts/ci/release-images.mjs verify-public --version "$VERSION" --revision "$GITHUB_SHA" --expect-from-env
          else
            node scripts/ci/release-images.mjs verify-public --version "$VERSION" --revision "$GITHUB_SHA"
          fi

      # The GitHub Release body is the curated CHANGELOG.md section, not
      # `--generate-notes`' list of commit subjects. This project treats a
      # changelog entry as a blocking requirement of every change; publishing
      # commit subjects instead threw that work away on the way to the only
      # place users read it. A missing section fails the release.
      - name: Extract the release notes from CHANGELOG.md
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/ci/changelog-extract.mjs "$VERSION" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      # Created only by a run that published the images itself (from `main`, digest
      # verified above), so no other path can mint a release tag, and the Release
      # step's `--verify-tag` then fails every other path closed. Skipped when the
      # tag already exists — a re-run, or a workflow_dispatch on an unchanged
      # commit. The publish step still reconciles the Release, so a
      # run interrupted between tagging and publishing heals when THAT run is
      # retried (or dispatched again on the same commit). It does not heal on a
      # later commit: once `v<version>` exists, a subsequent push reports
      # "nothing to release" and that version's Release stays unpublished until
      # someone re-dispatches this workflow on the tag itself
      # (`gh workflow run release.yml --ref v<version>`). The failed run is red,
      # so the gap is visible rather than silent. That dispatch re-runs the whole
      # gauntlet at the tagged commit, so weeks later a newly published advisory
      # can stop it; the manual fallback is
      # `node scripts/ci/changelog-extract.mjs X.Y.Z > notes.md` then
      # `gh release create vX.Y.Z --verify-tag --notes-file notes.md`.
      - name: Create the tag
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.create_tag == 'true' && needs.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      # Pushing this tag with GITHUB_TOKEN cannot start another workflow run —
      # GitHub suppresses that to prevent recursion — and this workflow only
      # listens on branch pushes anyway, which a `refs/tags/*` push never matches.
      # Two independent reasons the release cannot release itself.
      #
      # --verify-tag is not optional. Left off, and given a tag that does not
      # exist on the remote, `gh release create` does not fail — it silently
      # creates the tag "from the latest state of the default branch", which on a
      # busy repo is a DIFFERENT commit than the one this run built. Better to
      # abort and let the next push retry than to publish a release pointing at
      # code nobody built.
      - name: Publish the GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --notes-file release-notes.md

      - name: Report a push that released nothing
        if: steps.version.outputs.should_release != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "No release: v$VERSION is already tagged. Bump the root package.json" \
               "version and add its CHANGELOG.md section to cut a new release."
