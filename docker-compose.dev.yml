# =============================================================================
# H-Vault — development stack
# =============================================================================
#   docker compose -f docker-compose.dev.yml up -d
#
# Deliberately NOT a miniature of the production stack. There is no internal Nginx
# and no replica set here: Vite serves the SPA on :5173 with hot reload and proxies
# /api to Express on :5000, and MongoDB runs unauthenticated as a standalone. That
# keeps the loop fast. It also means the transactional code paths take their
# sequential fallback, and the CSP nonce / single-port routing are NOT exercised —
# use the production stack (`docker compose up -d --build`) to test those.
#
# The storage engine IS the production one, pinned to the same digest, with fixed
# development credentials and a published loopback port for host tooling — the
# same treatment hvault-db gets here.
#
# Either backing service is also useful on its own for `npm run dev` on the host:
#   docker compose -f docker-compose.dev.yml up -d hvault-db
#   docker compose -f docker-compose.dev.yml up -d hvault-s3

name: hvault-dev

services:
  hvault-db:
    # Same major as production (docker/mongo.Dockerfile), so a behaviour difference
    # between the two can never be a MongoDB version difference. No auth and no
    # replica set here, though — see the header.
    image: mongo:8.0
    container_name: hvault-db-dev
    restart: unless-stopped
    ports:
      # Published for host-side tooling (mongosh, Compass, the E2E helpers).
      - '127.0.0.1:27017:27017'
    environment:
      MONGO_INITDB_DATABASE: hvault
      # LOAD-BEARING on the 8.x line: without it mongod aborts at startup on any
      # Linux 6.19+ kernel (Ubuntu 26.04) — SERVER-121912, still unpatched — and
      # `restart: unless-stopped` turns that into a silent crash loop. Never set it
      # to 0; that is the value that breaks. See docker-compose.yml for the detail.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - hvault-data-dev:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hvault-s3:
    # The same pinned, digest-locked image the production stack runs, so a
    # document-store behaviour difference between dev and prod can never be a
    # storage-engine version difference. Same flags too: `--single-node` writes
    # the layout on first boot and `--default-bucket` creates the bucket and mints
    # the access key, so there is nothing to provision by hand here either.
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    container_name: hvault-s3-dev
    restart: unless-stopped
    entrypoint: /garage
    command: server --single-node --default-bucket
    ports:
      # Published for host-side tooling (the AWS CLI, a bucket browser, the
      # storage conformance suite), exactly as hvault-db is above — and, exactly
      # as hvault-db is, bound to loopback and to loopback only.
      - '127.0.0.1:3900:3900'
    environment:
      # FIXED DEVELOPMENT CREDENTIALS, and they are safe to publish here for the
      # same reason the dev database has no authentication at all: this stack has
      # no route to anything real. They are literals rather than `${...}` reads so
      # that `docker compose -f docker-compose.dev.yml up -d` needs no .env, which
      # is the whole point of this file. NEVER copy them into the production
      # stack, which guards the same four keys with `${...:?}` and ships them
      # empty.
      #
      # The RPC secret has to be 32 bytes of hex, so it cannot say what it is in
      # plain text the way the other three do. It is the hex encoding of
      # "dev-only-not-a-real-rpc-secret!!", which is what it says once decoded.
      GARAGE_RPC_SECRET: 6465762d6f6e6c792d6e6f742d612d7265616c2d7270632d7365637265742121
      GARAGE_DEFAULT_ACCESS_KEY: hvaultdev
      GARAGE_DEFAULT_SECRET_KEY: dev-only-not-a-real-secret-key!!
      GARAGE_DEFAULT_BUCKET: hvault-documents
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - hvault-s3-meta-dev:/var/lib/garage/meta
      - hvault-s3-data-dev:/var/lib/garage/data
    healthcheck:
      # Exec form: the image ships no shell.
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  hvault-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    container_name: hvault-app-dev
    restart: unless-stopped
    command: npm run dev
    ports:
      - '127.0.0.1:5173:5173'
      - '127.0.0.1:5000:5000'
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/server/src:/app/packages/server/src
      - ./packages/client/src:/app/packages/client/src
      - ./packages/client/public:/app/packages/client/public
      # Keep the image's node_modules; do not let an empty/host one shadow it.
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: '5000'
      # Bind Vite to every container interface so the published port reaches it —
      # Docker DNATs to eth0, not loopback. Outside Docker, vite.config.ts defaults
      # to 127.0.0.1.
      VITE_HOST: 0.0.0.0
      # Must match the published port above and vite.config.helpers' DEFAULT_DEV_PORT.
      VITE_PORT: '5173'
      MONGODB_URI: mongodb://hvault-db:27017/hvault
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-jwt-access-secret-do-not-use-in-production!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-jwt-refresh-secret-do-not-use-in-production!}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-do-not-use-in-production!!}
      CORS_ORIGIN: http://localhost:5173
      APP_URL: http://localhost:5173
      # Matches hvault-s3 above. All four connection variables are set, so the
      # document store is ON in the dev stack; the app validates them all-or-none
      # and a partial set would disable the feature with a warning.
      S3_ENDPOINT: http://hvault-s3:3900
      S3_BUCKET: hvault-documents
      S3_ACCESS_KEY_ID: hvaultdev
      S3_SECRET_ACCESS_KEY: dev-only-not-a-real-secret-key!!
    depends_on:
      hvault-db:
        condition: service_healthy
      # Ordering only, exactly as in the production stack: storage is optional and
      # must never be able to hold the app down.
      hvault-s3:
        condition: service_started

volumes:
  hvault-data-dev:
  hvault-s3-meta-dev:
  hvault-s3-data-dev:
